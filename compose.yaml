services:
  frankenphp:
    build:
      context: .
      target: dev
    image: frankenphp-dev:latest
    container_name: frankenphp-dev-server
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP3_PORT:-443}:443/udp"
      - "${CADDY_ADMIN_PORT:-2019}:2019"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: "${SERVER_NAME:-:80, :443, localhost}"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_PUBLISHER_JWT_KEY:-FrankenPHPMercurePublisherSecretKey2026Dev!}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_SUBSCRIBER_JWT_KEY:-FrankenPHPMercureSubscriberSecretKey2026Dev!}"
      MERCURE_PUBLIC_URL: "${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}"
      MERCURE_INTERNAL_URL: "${MERCURE_INTERNAL_URL:-http://127.0.0.1:80/.well-known/mercure}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: frankenphp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: frankenphp-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
  redis_data:
