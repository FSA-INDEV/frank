services:
  frankenphp:
    build:
      context: .
      target: dev
    image: frankenphp-dev:latest
    container_name: frankenphp-dev-server
    restart: unless-stopped
    command: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP3_PORT:-443}:443/udp"
      - "${CADDY_ADMIN_PORT:-2019}:2019"
    volumes:
      - .:/app
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./php.ini:/usr/local/etc/php/conf.d/99-custom.ini
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SERVER_NAME: "${SERVER_NAME:-:80, :443, localhost}"
      DB_HOST: "${DB_HOST:-database}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-app_dev}"
      DB_USERNAME: "${DB_USERNAME:-dev}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      MERCURE_PUBLISHER_JWT_KEY: "${MERCURE_PUBLISHER_JWT_KEY:-FrankenPHPMercurePublisherSecretKey2026Dev!}"
      MERCURE_SUBSCRIBER_JWT_KEY: "${MERCURE_SUBSCRIBER_JWT_KEY:-FrankenPHPMercureSubscriberSecretKey2026Dev!}"
      MERCURE_PUBLIC_URL: "${MERCURE_PUBLIC_URL:-http://localhost/.well-known/mercure}"
      MERCURE_INTERNAL_URL: "${MERCURE_INTERNAL_URL:-http://127.0.0.1:80/.well-known/mercure}"
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
      - redis

  database:
    image: mariadb:11.4
    container_name: frankenphp-database
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_DATABASE:-app_dev}"
      MYSQL_USER: "${DB_USERNAME:-dev}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./.database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

  redis:
    image: redis:alpine
    container_name: frankenphp-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:latest
    container_name: frankenphp-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: database
    depends_on:
      - database

volumes:
  caddy_data:
  caddy_config:
  mariadb_data:
  redis_data:
